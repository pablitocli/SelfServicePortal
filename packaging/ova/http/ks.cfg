# =====================================================================================================
# Self-Service Portal appliance - AlmaLinux 9 minimal kickstart.
#
# Rendered by Packer with templatefile() (see almalinux9.pkr.hcl): build_username and build_password
# are substituted at build time. Keep literal dollar-brace sequences out of this file (HCL template
# syntax); escape them as $${...} if ever needed. The build password must not contain double quotes.
# =====================================================================================================
text
skipx
eula --agreed
firstboot --disabled
reboot --eject

lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'
timezone Etc/UTC --utc

# Build-time DHCP; per-instance network is applied at first boot from the OVF properties.
network --bootproto=dhcp --device=link --onboot=on --activate --noipv6 --hostname=ssp-appliance

# Root is locked (no password, no SSH). Administration: 'sspadmin' (wheel), created by provision.sh.
rootpw --lock
# Build-time account used by Packer over SSH; locked/removed by scripts/cleanup.sh.
user --name=${build_username} --groups=wheel --password="${build_password}" --plaintext

selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,chronyd,firewalld,auditd,vmtoolsd

# --- Storage: GPT + EFI, LVM with separate /var, /var/log, /var/log/audit, /tmp, /home --------------
# Sized for a 60 GB disk; about 10 GB stay free in the volume group for growth (lvextend -r).
zerombr
clearpart --all --initlabel --disklabel=gpt
bootloader --timeout=3 --append="audit=1 audit_backlog_limit=8192"
reqpart --add-boot
part pv.01 --fstype=lvmpv --size=1 --grow
volgroup vg_ssp pv.01
logvol /              --vgname=vg_ssp --name=lv_root  --fstype=xfs --size=16384
logvol /var           --vgname=vg_ssp --name=lv_var   --fstype=xfs --size=10240 --fsoptions="nodev"
logvol /var/log       --vgname=vg_ssp --name=lv_log   --fstype=xfs --size=6144  --fsoptions="nodev,nosuid,noexec"
logvol /var/log/audit --vgname=vg_ssp --name=lv_audit --fstype=xfs --size=2048  --fsoptions="nodev,nosuid,noexec"
logvol /tmp           --vgname=vg_ssp --name=lv_tmp   --fstype=xfs --size=4096  --fsoptions="nodev,nosuid,noexec"
logvol /home          --vgname=vg_ssp --name=lv_home  --fstype=xfs --size=2048  --fsoptions="nodev"
logvol swap           --vgname=vg_ssp --name=lv_swap  --size=4096

%packages --inst-langs=en_US
@^minimal-environment
open-vm-tools
chrony
firewalld
audit
openssh-server
sudo
python3
openssl
curl
tar
unzip
jq
policycoreutils-python-utils
-iwl*-firmware
-plymouth
-cockpit*
%end

%post --log=/root/ks-post.log
# Passwordless sudo for the build account only (removed at shutdown by the cleanup finalizer).
echo "${build_username} ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/90-packer-build
chmod 0440 /etc/sudoers.d/90-packer-build
# No root login over SSH (first match wins in sshd_config.d).
printf 'PermitRootLogin no\n' > /etc/ssh/sshd_config.d/00-ssp-no-root.conf
chmod 0600 /etc/ssh/sshd_config.d/00-ssp-no-root.conf
%end
