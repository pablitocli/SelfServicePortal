<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Self-Service Portal - Online Demo</title>
<style>
/*@PORTAL_CSS@*/
.lab-banner{background:#1f2937;color:#f9fafb;font:500 13px/1.4 system-ui,sans-serif;padding:8px 16px;text-align:center}
.lab-banner b{color:#fbbf24}
.lab-viewer{position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.6);display:flex;flex-direction:column;padding:24px}
.lab-viewer-bar{display:flex;gap:12px;align-items:center;background:#fff;padding:10px 14px;border-radius:8px 8px 0 0;flex-wrap:wrap}
.lab-viewer-bar .muted{flex:1;color:#6b7280;font-size:13px}
.lab-viewer iframe{flex:1;border:0;background:#fff;border-radius:0 0 8px 8px;width:100%}
@media (max-width:600px){.lab-viewer{padding:8px}}
</style>
</head>
<body>
<div class="lab-banner"><b>Online demo</b> &middot; Self-Service Portal @VERSION@ with sample data. No automation runs; submitted requests are simulated in your browser.</div>
<!--@PORTAL_BODY@-->
<script src="assets/demo-mock.js"></script>
<script src="assets/qrcode.js"></script>
<script src="assets/branding.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
