<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Self-Service Portal</title>
  <link rel="stylesheet" href="/assets/portal.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <img id="brandLogo" class="brand-logo hidden" alt="">
      <span class="brand-word" id="brandOrg">&nbsp;</span><span class="brand-sep"></span><span class="brand-app" id="portalName">Self-Service Portal</span>
    </div>
    <p class="muted" id="loginMessage" style="margin:6px 0 0">Sign in with your corporate account.</p>

    <div id="info" class="alert alert-ok hidden" style="margin:18px 0 0"></div>
    <div id="err" class="alert alert-err hidden" style="margin:18px 0 0" role="alert"></div>

    <!-- Step 1 posts JSON to /api/auth/login; on success the ticket is posted to /login (Pode form sign-in). -->
    <form id="loginForm" autocomplete="on" novalidate>
      <div id="credStep">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="jdoe, DOMAIN\jdoe, jdoe@domain or local account" required autofocus autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
      </div>
      <div id="otpStep" class="hidden">
        <div class="field">
          <label for="otp">Verification code</label>
          <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code or recovery code" maxlength="9">
          <div class="hint">Open your authenticator app. Lost your phone? Use one of your recovery codes (xxxx-xxxx).</div>
        </div>
      </div>
      <button class="btn btn-primary" type="submit" id="submitBtn" style="padding:10px">Sign in</button>
    </form>
    <form id="ticketForm" method="post" action="/login" class="hidden">
      <input type="hidden" name="username" id="tUser">
      <input type="hidden" name="password" id="tTicket">
    </form>
    <div class="login-foot" id="footerText">Confidential - Internal Use. Access is logged and audited.</div>
  </main>
  <script src="/assets/branding.js"></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const show = (id, msg) => { const e = $(id); e.textContent = msg; e.classList.toggle('hidden', !msg); };
      const reasons = {
        signedout: 'You have signed out.',
        idle: 'You were signed out after a period of inactivity.',
        expired: 'Your session expired. Please sign in again.',
        revoked: 'Your session was ended by an administrator.'
      };
      let reason = null;
      try { reason = sessionStorage.getItem('ssp-logout-reason'); sessionStorage.removeItem('ssp-logout-reason'); } catch { /* private mode */ }
      if (reason && reasons[reason]) show('info', reasons[reason]);
      else if (new URLSearchParams(location.search).has('error')) show('err', 'Sign-in expired before it completed. Please try again.');

      fetch('/api/branding').then((r) => r.ok ? r.json() : null).then((b) => { if (b) window.applyBranding(b); }).catch(() => {});

      let busy = false;
      $('loginForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if (busy) return;
        const body = { username: $('username').value.trim(), password: $('password').value, otp: $('otp').value.trim() };
        if (!body.username || !body.password) return show('err', 'Enter your username and password.');
        busy = true; $('submitBtn').disabled = true; show('err', ''); show('info', '');
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'X-Portal-Request': '1' },
            body: JSON.stringify(body)
          });
          const data = await res.json().catch(() => ({}));
          if (data.ok && data.ticket) {
            $('tUser').value = body.username; $('tTicket').value = data.ticket;
            $('password').value = '';
            $('ticketForm').submit();
            return;
          }
          if (data.next === 'mfa') {
            $('credStep').classList.add('hidden'); $('otpStep').classList.remove('hidden');
            $('submitBtn').textContent = 'Verify';
            if (body.otp) show('err', data.message || 'The verification code is not valid.'); else show('info', data.message || '');
            $('otp').value = ''; $('otp').focus();
          }
          else {
            show('err', data.message || 'Sign-in failed.');
            $('otpStep').classList.add('hidden'); $('credStep').classList.remove('hidden'); $('otp').value = '';
            $('submitBtn').textContent = 'Sign in'; $('password').value = ''; $('password').focus();
          }
        }
        catch { show('err', 'The portal is not reachable. Try again in a moment.'); }
        finally { busy = false; $('submitBtn').disabled = false; }
      });
    })();
  </script>
</body>
</html>
