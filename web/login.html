<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Self-Service Portal</title>
  <link rel="stylesheet" href="/assets/portal.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <img id="brandLogo" class="brand-logo hidden" alt="">
      <span class="brand-word" id="brandOrg">&nbsp;</span><span class="brand-sep"></span><span class="brand-app" id="portalName">Self-Service Portal</span>
    </div>
    <p class="muted" id="loginMessage" style="margin:6px 0 0">Sign in with your corporate account.</p>

    <div id="info" class="alert alert-ok hidden" style="margin:18px 0 0"></div>
    <div id="err" class="alert alert-err hidden" style="margin:18px 0 0" role="alert"></div>
    <noscript><div class="alert alert-err" style="margin:18px 0 0">JavaScript is required to sign in.</div></noscript>

    <!-- Step 1 posts JSON to /api/auth/login; on success the ticket is posted to /login (Pode form sign-in). -->
    <!-- method=post: even if the script cannot run, credentials are never placed in the URL. -->
    <form id="loginForm" method="post" action="/login" autocomplete="on" novalidate>
      <div id="credStep">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="jdoe, DOMAIN\jdoe, jdoe@domain or local account" required autofocus autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
      </div>
      <div id="otpStep" class="hidden">
        <div class="field">
          <label for="otp">Verification code</label>
          <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code or recovery code" maxlength="9">
          <div class="hint">Open your authenticator app. Lost your phone? Use one of your recovery codes (xxxx-xxxx).</div>
        </div>
      </div>
      <button class="btn btn-primary" type="submit" id="submitBtn" style="padding:10px">Sign in</button>
    </form>
    <form id="ticketForm" method="post" action="/login" class="hidden">
      <input type="hidden" name="username" id="tUser">
      <input type="hidden" name="password" id="tTicket">
    </form>
    <div class="login-foot" id="footerText">Confidential - Internal Use. Access is logged and audited.</div>
  </main>
  <script src="/assets/branding.js"></script>
  <script src="/assets/login.js"></script>
</body>
</html>
